<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Segurança - Atualização de Senha</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #F3F4F6; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); width: 100%; max-width: 400px; }
        .btn-primary { background-color: #2563EB; color: white; font-weight: bold; padding: 0.75rem; border-radius: 0.375rem; width: 100%; margin-top: 1rem; transition: background-color 0.2s; }
        .btn-primary:hover { background-color: #1D4ED8; }
        .input-com-icone { padding-right: 50px !important; }
    </style>
</head>
<body>

    <div class="card animate-fade-in-up">
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-full bg-red-100 mb-4">
                <span class="text-2xl">🔒</span>
            </div>
            <h2 class="text-xl font-bold text-gray-800">Atualização Obrigatória</h2>
            <p class="text-gray-500 text-sm mt-2">
                Detectamos que você está usando a senha provisória. 
                <br>Por favor, defina uma nova senha pessoal.
            </p>
        </div>

        {% if error %}
            <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-3 mb-4 text-sm rounded" role="alert">
                <p class="font-bold">Atenção:</p>
                <p>{{ error }}</p>
            </div>
        {% endif %}

        <form method="POST" action="{{ url_for('cliente_troca_senha_obrigatoria') }}">
            
            <div class="mb-4">
                <label class="block text-gray-700 text-xs font-bold mb-1 uppercase tracking-wide">Nova Senha</label>
                <div class="relative w-full">
                    <input type="password" name="nova_senha" id="nova_senha" required 
                           class="input-com-icone w-full p-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" 
                           placeholder="Crie sua nova senha">
                    
                    <button type="button" onclick="toggleSenha('nova_senha', this)" 
                            class="absolute inset-y-0 right-0 px-3 flex items-center justify-center text-gray-400 hover:text-blue-600 focus:outline-none bg-transparent border-none cursor-pointer">
                        👁️
                    </button>
                </div>
                <p class="text-[10px] text-gray-400 mt-1">Não use "Senha" ou sequências simples.</p>
            </div>

            <div class="mb-2">
                <label class="block text-gray-700 text-xs font-bold mb-1 uppercase tracking-wide">Confirmar Nova Senha</label>
                <div class="relative w-full">
                    <input type="password" name="confirma_senha" id="confirma_senha" required 
                           class="input-com-icone w-full p-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition" 
                           placeholder="Repita a senha">
                    
                    <button type="button" onclick="toggleSenha('confirma_senha', this)" 
                            class="absolute inset-y-0 right-0 px-3 flex items-center justify-center text-gray-400 hover:text-blue-600 focus:outline-none bg-transparent border-none cursor-pointer">
                        👁️
                    </button>
                </div>
            </div>

            <button type="submit" class="btn-primary shadow-lg">
                💾 Salvar e Acessar Sistema
            </button>
        </form>
        
        <div class="mt-4 text-center">
            <a href="/logout-cliente" class="text-xs text-gray-400 hover:text-gray-600 underline">Cancelar e Sair</a>
        </div>
    </div>

    <script>
        function toggleSenha(fieldId, btn) {
            const input = document.getElementById(fieldId);
            if (input.type === "password") {
                input.type = "text";
                btn.innerHTML = "🙈"; 
            } else {
                input.type = "password";
                btn.innerHTML = "👁️"; 
            }
        }
    </script>

</body>
</html>
