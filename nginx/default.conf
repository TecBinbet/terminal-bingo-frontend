server {
    listen 80;
    server_name localhost;

    # --- FRONTEND (Arquivos estáticos) ---
    # O frontend carrega, mas o JS não vai conseguir conectar no socket sem ID
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Imagens
    location /img/ {
        alias /usr/share/nginx/html/img/;
    }

    # =========================================================
    # SALA 1
    # =========================================================
    location ^~ /sala1/ {
        proxy_pass http://backend_sala1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================================
    # SALA 2
    # =========================================================
    location ^~ /sala2/ {
        proxy_pass http://backend_sala2:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # =========================================================
    # SALA 3 (Antiga Sala 0)
    # Agora é uma rota explícita, igual às outras
    # =========================================================
    location ^~ /sala3/ {
        proxy_pass http://backend_sala3:3001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    
    # OBSERVAÇÃO: A rota "genérica" foi removida. 
    # Qualquer chamada fora de /sala1, /sala2 ou /sala3 dará erro 404 (correto).
}