server {
    listen 80;
    server_name localhost;

    # --- REGRA 1: ARQUIVOS ESTÁTICOS (Frontend) ---
    # Qualquer coisa que NÃO for stream ou api cai aqui.
    # O Nginx entrega o arquivo físico (index.html, styles.css, etc).
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # Se não achar o arquivo, serve o index.html (importante para SPAs)
        try_files $uri $uri/ /index.html;
    }

    # --- REGRA 2: IMAGENS (Opcional, mas recomendado) ---
    # Garante que as imagens sejam servidas rapidinho direto do disco
    location /img/ {
        alias /usr/share/nginx/html/img/;
    }

    # --- REGRA 3: O PYTHON (Backend + WebSocket) ---
    # Aqui está o segredo. Usamos "~" para dizer "Regra de Expressão Regular".
    # Tradução: "Se o link começar com /stream, /login, /admin ou /api..."
    location ~ ^/(stream|login|admin|api) {
        # ...mande para o container do Python na porta 3001
        proxy_pass http://backend:3001;

        # Configurações obrigatórias para o WebSocket não cair
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Repassa o IP real do cliente para o Python saber quem é
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Timeout longo (1 dia) para o jogo não desconectar à toa
        proxy_read_timeout 86400;
    }
}